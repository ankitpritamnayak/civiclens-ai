<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLens AI | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script defer src="auth.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-jakarta antialiased min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Global Background Blur Elements (The Magic Sauce) -->
    <div class="fixed inset-0 -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/10 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-violet-600/10 blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md px-6 z-10">
        <div class="glass-card p-8 md:p-10 border border-white/10 shadow-2xl shadow-indigo-500/10">
            
            <div class="text-center mb-8">
                <img src="logo.svg" alt="CivicLens AI Logo" class="h-20 w-auto mx-auto mb-4">
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    Welcome Back
                </h1>
                <p class="text-slate-400 mt-2 text-sm">Login to your CivicLens AI account</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-slate-500 text-sm"></i>
                        </div>
                        <input id="login-email" type="email" placeholder="name@example.com" class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-900/50 border border-white/10 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-500 text-sm"></i>
                        </div>
                        <input id="login-password" type="password" placeholder="••••••••" class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-900/50 border border-white/10 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600">
                    </div>
                </div>

                <button onclick="login()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-95 py-3.5 rounded-xl font-semibold text-sm tracking-wide transition shadow-lg shadow-indigo-600/25 mt-2 flex items-center justify-center gap-2">
                    <span>Secure Login</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <p class="text-center mt-8 text-slate-400 text-sm">
                Don't have an account? <a href="signup.html" class="text-indigo-400 font-semibold hover:text-indigo-300 transition">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
